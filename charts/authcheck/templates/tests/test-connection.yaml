apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "authcheck.fullname" . }}-test-connection"
  labels:
    {{- include "authcheck.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args:
        - '--spider'
        - '--server-response'
        - 'http://{{ include "authcheck.fullname" . }}:{{ .Values.service.port }}/api/up'
  restartPolicy: Never